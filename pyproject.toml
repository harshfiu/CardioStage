# pyproject.toml describes this project as an installable Python package.
# Installing it in "editable" mode (pip install -e .) lets any script, test,
# or the Streamlit app write `from cardiostage import config`, while edits to
# the code take effect immediately without reinstalling.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiostage"
version = "0.1.0"
description = "Staged, calibrated, explainable heart-disease risk screening."
readme = "README.md"
# Built and tested on Python 3.12 (pandas 3.x and numpy 2.5 need 3.11+).
requires-python = ">=3.12"

# Exact versions this project was built and tested with. Pinning (==) means
# anyone who installs gets the same behaviour we did; library updates can
# change results or break code. Every *indirect* dependency is pinned too,
# with file checksums, in uv.lock (security finding SEC-07).
#
# Install:   uv sync                     (creates .venv from uv.lock, exactly)
# Without uv: pip install -r requirements.txt --require-hashes && pip install -e . --no-deps
dependencies = [
    # --- Data handling ---
    "pandas==3.1.1",        # tables (DataFrames): loading, cleaning, reshaping data
    "numpy==2.5.5",         # fast numerical arrays; pandas & scikit-learn build on it
    # --- Machine learning ---
    "scikit-learn==1.9.1",  # logistic regression, random forest, calibration, metrics
    "xgboost==3.4.1",       # gradient-boosted trees, often strongest on tabular data
    "shap==0.54.1",         # explains individual predictions
    "joblib==1.6.0",        # saving/loading trained models to/from disk
    # --- Visualisation ---
    "matplotlib==3.11.2",   # core plotting library (static charts for the README)
    "seaborn==0.13.2",      # nicer statistical charts on top of matplotlib
    "plotly==7.1.0",        # interactive charts inside the Streamlit app
    # --- App ---
    "streamlit==1.67.0",    # turns Python scripts into an interactive web app
]

[dependency-groups]
# Development tools: installed by `uv sync` by default, not needed to run the app.
dev = [
    "pytest==9.2.0",        # runs the automated checks in tests/
    "ruff==0.17.6",         # linter + formatter:  ruff check .  /  ruff format .
    "pip-audit==2.10.1",    # dependency vulnerability scan
]

[tool.setuptools.packages.find]
where = ["src"]          # our package code lives in src/cardiostage

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]   # long lines: some explanatory strings read better unbroken

[tool.ruff.lint.isort]
known-first-party = ["cardiostage", "ui"]
