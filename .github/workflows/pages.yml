# Publishes the static landing site (site/) to GitHub Pages on each push to
# main that changes it. One-time setup by the repo owner:
#   GitHub → Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The site is static (HTML/CSS/JS, vendored libraries, no backend, no patient data).
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Least privilege: read the repo, and the two scopes GitHub Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site/ to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
