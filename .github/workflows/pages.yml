# Publishes the static landing site (site/) to GitHub Pages on each push to
# main that changes it. One-time setup by the repo owner:
#   GitHub → Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The site is static (HTML/CSS/JS, vendored libraries, no backend, no patient data).
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Least privilege: read the repo, and the two scopes GitHub Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site/ to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
