# Publishes the static landing site (site/) to GitHub Pages on each push to
# main that changes it. One-time setup by the repo owner:
#   GitHub → Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The site is static (HTML/CSS/JS, vendored libraries, no backend, no patient data).
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Least privilege: read the repo, and the two scopes GitHub Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as in GitHub's official Pages template. With upload and deploy in
# ONE job, deploy-pages intermittently failed with "No artifacts named
# github-pages were found" (twice in five runs): the uploaded artifact isn't
# always registered yet when the next step asks for it. A separate deploy job
# starts only after the build job, and its artifact, are complete.
jobs:
  build:
    name: Package site/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
