# Continuous integration: runs on every push and pull request to main.
# Security controls from brain/security/: SEC-07 (dependency audit, locked
# installs with checksums, actions pinned to commits) and R-3 (secret
# scanning), plus lint and the test suite.
#
# Actions are pinned to full commit SHAs (a tag like v7 can be moved to point
# at different code; a commit SHA can't). The comment shows the version.
# Dependabot updates both together.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install exactly what uv.lock records (versions + checksums)
        # --locked fails if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked

      - name: requirements.txt matches uv.lock
        # requirements.txt is generated from the lock for pip users; it must not drift.
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --quiet -o /tmp/requirements.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)

      - name: Lint (ruff)
        run: uv run ruff check src tests app tools

      - name: Tests
        # Model files aren't stored in Git, so tests that need trained models
        # are skipped here (they report "trained models missing").
        run: uv run pytest -q -rs

      - name: Dependency vulnerability audit (pip-audit)
        # Audits every installed package (app + dev tools); skips our own package.
        run: uv run pip-audit --skip-editable --progress-spinner off

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the latest commit

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
